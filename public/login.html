<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Authenticate · Sentinel</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"
        integrity="sha384-hs5SINUk7GPohxRis+rS7grpSWEbtOIJ3sRoseBKg3CDPIKpG55RfSenbvA6ALOt" crossorigin="anonymous" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card card hud">
      <span class="eclipse lg" aria-hidden="true"></span>
      <h1>Responder authentication</h1>
      <p class="sub">SENTINEL // secure channel</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" placeholder="responder@my.sliit.lk" required />
        </div>
        <div class="field">
          <label for="password">Passphrase</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••••" required />
          <span class="err" id="form-err"></span>
        </div>
        <button type="submit" class="btn primary block" id="submit-btn">
          <i class="ti ti-login-2" aria-hidden="true"></i> Authenticate
        </button>
      </form>
      <p class="access-note">Accounts are issued by Sentinel Control. Contact an administrator if you cannot sign in.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
          integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="/config.js"></script>
  <script src="/assets/notify.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
