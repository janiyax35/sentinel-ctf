<svg xmlns="http://www.w3.org/2000/svg" width="840" height="145" viewBox="0 0 840 145" role="img" aria-labelledby="title desc">
<title id="title">SENTINEL CTF</title>
<desc id="desc">SENTINEL CTF in giant outlined letters with a slowly moving lime spotlight.</desc>
<style>@font-face{font-family:SG;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
.m{font-family:JBM,ui-monospace,"Cascadia Code",Consolas,monospace}
.s{font-family:SG,system-ui,-apple-system,"Segoe UI",sans-serif}
.up{text-transform:uppercase}
.spot{animation:spot 11s ease-in-out infinite alternate both}@keyframes spot{from{transform:translateX(-360px)}to{transform:translateX(360px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151C25"/><stop offset=".75" stop-color="#0B0E13"/></linearGradient>
<linearGradient id="fadeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity=".5"/><stop offset=".92" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="840" height="145"><rect width="840" height="145" fill="url(#fadeG)"/></mask>
<radialGradient id="sp"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="spot" maskUnits="userSpaceOnUse" x="0" y="0" width="840" height="145"><circle class="spot" cx="420" cy="72.5" r="170" fill="url(#sp)"/></mask>
</defs>
<rect width="840" height="145" rx="6" fill="#0A0D12"/>
<g mask="url(#fade)">
<text class="s" x="420" y="128" text-anchor="middle" font-size="136" font-weight="700" letter-spacing="-6.80" fill="url(#fill)" stroke="#1E2630" stroke-width="1">SENTINEL CTF</text>
<g mask="url(#spot)"><text class="s" x="420" y="128" text-anchor="middle" font-size="136" font-weight="700" letter-spacing="-6.80" fill="#B6FF3B" fill-opacity=".16" stroke="#B6FF3B" stroke-width="1.5">SENTINEL CTF</text></g>
</g>
</svg>
