.p7{animation:rise 0.35s ease-out 0.63s both}
.p8{animation:rise 0.35s ease-out 0.7s both}
.p9{animation:rise 0.35s ease-out 0.77s both}
.pa{animation:rise 0.35s ease-out 0.8400000000000001s both}
.pb{animation:rise 0.35s ease-out 0.91s both}
.hot{stroke-dasharray:4 4;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-8}}
.pc{animation:rise 0.4s ease-out 1s both}
@keyframes kd{0%{opacity:0;transform:translateX(0)}15%,85%{opacity:1}100%{opacity:0;transform:translateX(58px)}}
@keyframes ke{0%{opacity:0;transform:translateX(0)}15%,85%{opacity:1}100%{opacity:0;transform:translateX(60px)}}
.pf{animation:rise 0.35s ease-out 1.4s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
