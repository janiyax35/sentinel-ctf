<svg xmlns="http://www.w3.org/2000/svg" width="840" height="356" viewBox="0 0 840 356" role="img" aria-labelledby="title desc">
<title id="title">Sentinel CTF architecture</title>
<desc id="desc">Three zones. INTERNET · UNTRUSTED, VERCEL, SUPABASE. Nodes: cdn libraries (pinned · sri hashes); responder browser (static ui · anon key); cloudflare dns (ctf.janith.qzz.io); static pages (csp · nosniff · deny frames); /api · 8 functions (node runtime · 0 npm deps); env secrets (service key · flag pepper); auth (email + password · signup off); postgres (rls on all tables · deny-all); storage (private bucket · 60 s signed urls). The browser loads pinned CDN libraries and resolves ctf.janith.qzz.io through Cloudflare DNS, gets static pages from Vercel, signs in directly with Supabase Auth, and sends every flag, hint and admin request to the /api functions. The functions read env secrets, verify the user's token with Supabase Auth, query Postgres and sign Storage URLs. hot path: flag submission · browser -&gt; /api/submit -&gt; hmac check -&gt; postgres (service role).</desc>
