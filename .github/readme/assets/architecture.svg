.s{font-family:SG,system-ui,-apple-system,"Segoe UI",sans-serif}
.up{text-transform:uppercase}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.p0{animation:rise 0.35s ease-out 0.15s both}
.p1{animation:rise 0.35s ease-out 0.25s both}
.p2{animation:rise 0.35s ease-out 0.35s both}
.p3{animation:rise 0.35s ease-out 0.35s both}
.p4{animation:rise 0.35s ease-out 0.42s both}
.p5{animation:rise 0.35s ease-out 0.49s both}
