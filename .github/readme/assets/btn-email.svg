</style>
<defs><clipPath id="b"><rect x=".5" y=".5" width="101" height="39" rx="3"/></clipPath>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect x=".5" y=".5" width="101" height="39" rx="3" fill="#10151C" stroke="#2A3542"/>
<path d="M0.5 7.5V0.5h7M101.5 32.5V39.5h-7" fill="none" stroke="#B6FF3B"/>
<g clip-path="url(#b)"><rect class="shine" x="-70" y="0" width="60" height="40" fill="url(#g)" transform="skewX(-20)"/></g>
