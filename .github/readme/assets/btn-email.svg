<style>@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
.m{font-family:JBM,ui-monospace,"Cascadia Code",Consolas,monospace}
.s{font-family:SG,system-ui,-apple-system,"Segoe UI",sans-serif}
.up{text-transform:uppercase}
.shine{animation:shine 6s ease-in-out 1s infinite both}@keyframes shine{0%{transform:translateX(0)}25%,100%{transform:translateX(182px)}}
